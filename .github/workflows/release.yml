name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: clearbit-linux-amd64
          # macos-13 = Intel runners, matching the amd64 artifact name
          # (macos-latest is arm64 now).
          - os: macos-13
            artifact: clearbit-macos-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y librocksdb-dev libsecp256k1-dev libsnappy-dev
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install rocksdb secp256k1 snappy
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.13.0"
      - run: zig build -Doptimize=ReleaseFast
      - name: Package
        run: cp zig-out/bin/clearbit ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
